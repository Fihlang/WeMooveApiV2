version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: furniture_delivery_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Strong_Password123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - furniture_delivery_network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: furniture_delivery_api
    ports:
      - "5000:80"
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FurnitureDeliveryDb;User Id=sa;Password=Strong_Password123!;TrustServerCertificate=True;
    networks:
      - furniture_delivery_network
    restart: unless-stopped

networks:
  furniture_delivery_network:
    driver: bridge

volumes:
  sqlserver_data: